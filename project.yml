name: Nightwatch
options:
  bundleIdPrefix: com.augustinv
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "N462N35929"
    CODE_SIGN_STYLE: Automatic
packages:
  FactoryKit:
    url: https://github.com/augustin-v/factorykit.git
    from: 1.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS.git
    from: 4.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  AuroraCore:
    path: AuroraCore
targets:
  Nightwatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Nightwatch
        excludes:
          - "Resources/Info.plist"
          - "Legal/Documents/**"
      - path: Nightwatch/Legal/Documents
        buildPhase: resources
    dependencies:
      - package: FactoryKit
      - package: RevenueCat
        product: RevenueCat
      - package: SuperwallKit
        product: SuperwallKit
      - package: PostHog
        product: PostHog
      - package: AuroraCore
    info:
      path: Nightwatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aurora Forecast - Nightwatch
        CFBundleDevelopmentRegion: en
        CFBundleIconName: AppIcon
        # Launch locale for en; Phase 3c adds nb, sv, fi, da, de-DE, nl-NL, fr
        # per the candidate spec's launch-locale list. Keep in sync with
        # CFBundleLocalizations here and the .xcstrings catalogs.
        CFBundleLocalizations:
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Localized via InfoPlist.xcstrings (String Catalog for Info.plist
        # keys) — the value here is the base-locale string that Xcode
        # resolves against that catalog at build time.
        NSLocationWhenInUseUsageDescription: "Nightwatch uses your location on-device to work out sunset, twilight and aurora visibility where you are, and to request a local cloud forecast. Your location is never sent to us."
        # Alert refresh (Phase 3b wires the actual BGTaskScheduler logic per
        # the candidate spec §2 — this scaffold declares the identifier and
        # background modes only).
        BGTaskSchedulerPermittedIdentifiers:
          - com.augustinv.nightwatch.refresh
        UIBackgroundModes:
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustinv.nightwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testable: true
