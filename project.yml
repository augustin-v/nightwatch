name: Nightwatch
options:
  bundleIdPrefix: com.augustinv
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "N462N35929"
    CODE_SIGN_STYLE: Automatic
packages:
  FactoryKit:
    url: https://github.com/augustin-v/factorykit.git
    from: 1.1.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS.git
    from: 4.0.0
  # First-party analytics. The factory replaced PostHog with its own
  # Cloudflare Worker + D1 backend and this dependency-free local package,
  # so the app ships no third-party analytics SDK at all.
  FactoryAnalytics:
    path: ../factory/analytics/FactoryAnalytics
  AuroraCore:
    path: AuroraCore
targets:
  Nightwatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Nightwatch
        excludes:
          - "Resources/Info.plist"
          - "Legal/Documents/**"
      - path: Nightwatch/Legal/Documents
        buildPhase: resources
    dependencies:
      - package: FactoryKit
      - package: RevenueCat
        product: RevenueCat
      - package: SuperwallKit
        product: SuperwallKit
      - package: FactoryAnalytics
        product: FactoryAnalytics
      - package: AuroraCore
      # Apple Ads install attribution (AdAttribution.swift).
      - sdk: AdServices.framework
    info:
      path: Nightwatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aurora Forecast - Nightwatch
        CFBundleDevelopmentRegion: en
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "4"
        # Launch locales per the candidate spec. Keep in sync with the
        # .xcstrings catalogs; a locale listed here with no catalog entries
        # silently ships English, which is worse than not listing it.
        CFBundleLocalizations:
          - en
          - nb
          - sv
          - fi
          - da
          - de-DE
          - nl-NL
          - fr
          - pl
          - it
          - es
          - cs
          - ja
          - ko
          - zh-Hant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Localized via InfoPlist.xcstrings (String Catalog for Info.plist
        # keys). The value here is the base-locale string that Xcode
        # resolves against that catalog at build time.
        NSLocationWhenInUseUsageDescription: "Nightwatch uses your location on-device to work out sunset, twilight and aurora visibility where you are, and to request a local cloud forecast. Your location is never sent to us."
        # Alert refresh (Phase 3b wires the actual BGTaskScheduler logic per
        # the candidate spec §2 — this scaffold declares the identifier and
        # background modes only).
        BGTaskSchedulerPermittedIdentifiers:
          - com.augustinv.nightwatch.refresh
        UIBackgroundModes:
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustinv.nightwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - NightwatchTests
      testable: true
      # Local StoreKit products, mirroring the real App Store Connect
      # subscription group. Sandbox purchases against the live products are
      # not possible while they sit in MISSING_METADATA, and this is how the
      # purchase path, the localized prices and the computed savings badge
      # get exercised before then. Debug only; it has no effect on release.
      environmentVariables: []
      storeKitConfiguration: Nightwatch.storekit
  NightwatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NightwatchTests
    dependencies:
      - target: Nightwatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
